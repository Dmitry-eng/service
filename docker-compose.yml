version: "3.8"
services:
  postgresqldb:
    image: postgres:latest
    container_name: db-service
    env_file: ./postgres-config.env
    ports:
      - "5432:5432"
  repair:
    container_name: repair-service
    build:
      dockerfile: ./Dockerfile
    env_file: ./postgres-config.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "80:8080"
